name: Daily Automated Domain Health Check & Email Alerts

on:
  schedule:
    # Runs 4 times a day (IST):
    # 1. 19:30 UTC -> 01:00 AM IST (Overnight audit)
    # 2. 03:30 UTC -> 09:00 AM IST (Morning before work)
    # 3. 08:30 UTC -> 02:00 PM IST (Afternoon check)
    # 4. 12:30 UTC -> 06:00 PM IST (Evening wrap-up)
    - cron: '30 3,8,12,19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  domain-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Execute Automated Domain Health Audit
        run: node scripts/auto-domain-checker.js
